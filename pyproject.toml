[project]
name = "hc_rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "torch",
    "sentence-transformers",
    "faiss-cpu",
    "python-dotenv",
    "openai",
    "pyyaml",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
